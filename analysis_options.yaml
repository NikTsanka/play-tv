include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Keep the bar high but don't block milestone iteration on style-only items.
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
    directives_ordering: true
